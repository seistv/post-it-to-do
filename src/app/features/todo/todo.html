<div class="app-container" [class.dark]="isDarkMode()">
  <!-- Add Task Form -->
  <div class="row align-items-center">
    <div class="col-auto">
      <input [(ngModel)]="newTask.title" id="title" type="text" class="form-control title" placeholder="Task title" required>
      <textarea class="form-control description mt-1" id="description" [(ngModel)]="newTask.description" placeholder="Details (optional)" rows="3"></textarea>
    </div>

    <div class="col-auto">
      <div class="btn-group btn-group-toggle">
        <input 
            type="radio"
            name="category"
            value="Work"
            id="work"
            class="btn-check"
            [(ngModel)]="newTask.category"
            autocomplete="off">
        <label class="btn btn-rdo" for="Work" [class.dark]="isDarkMode()">
            Work
        </label>

        <input 
            type="radio"
            name="category"
            value="Personal"
            id="personal"
            class="btn-check"
            [(ngModel)]="newTask.category"
            autocomplete="off">
        <label class="btn btn-rdo" for="Personal" [class.dark]="isDarkMode()">
            Personal
        </label>

        <input 
            type="radio"
            name="category"
            value="Study"
            id="study"
            class="btn-check"
            [(ngModel)]="newTask.category"
            autocomplete="off">
        <label class="btn btn-rdo" for="Study" [class.dark]="isDarkMode()">
            Study
        </label>

        <input 
            type="radio"
            name="category"
            value="Others"
            id="others"
            class="btn-check"
            [(ngModel)]="newTask.category"
            autocomplete="off">
        <label class="btn btn-rdo" for="Others" [class.dark]="isDarkMode()">
            Others
        </label>
      </div>

      <div class="row mt-1">
        <input type="date" class="form-control datepicker" id="due-date" [(ngModel)]="newTask.dueDate">
      </div>

      <div class="row mt-2">
        <button class="btn btn-warning" id="add-button" (click)="addTask()">Add</button>
      </div>
    </div>

  </div>

  <!-- Filters -->
  <div class="filters row mt-2">
    <div class="col-auto">
      <button class="btn btn-light" id="all-button" (click)="setFilter('All')">All</button>
      <button class="btn btn-light ms-1" id="completed-button" (click)="setFilter('Completed')">Completed</button>
      <button class="btn btn-light ms-1" id="pending-button" (click)="setFilter('Pending')">Pending</button>
    </div>
    <div class="col-auto">
      <button class="btn btn-light" id="theme-button" (click)="toggleTheme()"><i id="theme-icon" class="bi bi-moon"></i></button>
    </div>
  </div>

  <!-- Task Counter -->
  <div class="counter text-start mt-3">
    Total: {{tasks().length}} |
    Completed: {{completedCount()}} |
    Remaining: {{remainingCount()}}
  </div>

  <!-- Post-It Grid -->
  <div class="postit-grid" 
      cdkDropList 
      cdkDropListOrientation="mixed"
      [cdkDropListData]="tasks()" 
      (cdkDropListDropped)="drop($event)">
    @for (task of filteredTasks(); track task.id) {
      <div class="postit"
         cdkDrag
         [class.completed]="task.completed"
         [class.overdue]="isOverdue(task)">

        <h3>{{task.title}}</h3>
        <p class="description">{{ task.description }}</p>
        <p>📂 {{task.category}}</p>
        <p>📅 {{task.dueDate || 'N/A'}}</p>

        <div class="actions">
          <button type="button" class="icon-btn" (click)="toggleTask(task)">✔</button>
          <button type="button" class="icon-btn" (click)="deleteTask(task.id)">❌</button>
        </div>

      </div>
    }
  </div>
</div>
